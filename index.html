<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MORODOK · 医美贷款管理系统</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap');

:root {
  --bg: #0d1117;
  --bg2: #161b27;
  --panel: #1c2333;
  --panel-solid: #1c2333;
  --border: rgba(255,255,255,0.10);
  --border-hover: rgba(212,175,118,0.5);
  --ink: #e8e6e1;
  --ink-soft: #b0aaa0;
  --muted: #7a7670;
  --gold: #d4af76;
  --gold-light: #e8c990;
  --gold-dim: rgba(212,175,118,0.12);
  --rose: #e8a0a0;
  --teal: #4dd9c0;
  --red: #f87171;
  --green: #4ade80;
  --blue: #60a5fa;
  --amber: #fbbf24;
  --sidebar-w: 220px;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.35);
  font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 10% 0%, rgba(212,175,118,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 100%, rgba(77,217,192,0.03) 0%, transparent 60%);
}

button, input, select, textarea { font: inherit; }

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
}

/* ─── SIDEBAR ─── */
.sidebar {
  background: var(--bg2);
  border-right: 1px solid var(--border);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 6px 4px 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}

.brand-mark {
  width: 38px; height: 38px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--gold), #b8943f);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 17px;
  color: #0d1117;
  font-family: 'Playfair Display', serif;
}

.brand strong { display: block; font-size: 14px; font-weight: 700; color: #f0ece4; }
.brand span { display: block; font-size: 10px; color: var(--gold); margin-top: 2px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }

.nav { display: grid; gap: 2px; }

.nav-item {
  border: none;
  color: #c8c2b8;
  background: transparent;
  text-align: left;
  padding: 10px 13px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.18s;
  position: relative;
}

.nav-item:hover { background: rgba(255,255,255,0.06); color: #f0ece4; }

.nav-item.active {
  background: var(--gold-dim);
  color: var(--gold);
  font-weight: 600;
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 28%; bottom: 28%;
  width: 3px;
  border-radius: 0 2px 2px 0;
  background: var(--gold);
}

.sidebar-foot {
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  color: #7a7670;
  font-size: 11px;
  display: grid;
  gap: 3px;
}

#syncStatus { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #7a7670; margin-top: 4px; }
#syncDot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

/* ─── MAIN ─── */
.main { padding: 28px 32px; min-width: 0; }

.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 24px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 700;
  color: #f0ece4;
  letter-spacing: -0.01em;
}

h2 { font-size: 14px; font-weight: 600; color: #e8e4de; letter-spacing: 0.01em; }

.topbar p { color: var(--ink-soft); margin-top: 5px; font-size: 13px; }
.panel-head span { color: var(--ink-soft); font-size: 12px; }
.dialog-head p { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }

.top-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

/* ─── BUTTONS ─── */
button {
  border: none;
  border-radius: 9px;
  min-height: 38px;
  padding: 0 16px;
  cursor: pointer;
  white-space: nowrap;
  font-weight: 600;
  transition: all 0.18s;
}

.primary {
  background: linear-gradient(135deg, var(--gold), #b8943f);
  color: #0d1117;
  font-weight: 700;
  box-shadow: 0 3px 12px rgba(212,175,118,0.3);
}

.primary:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(212,175,118,0.4); }

.secondary {
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--border);
  color: #c8c2b8;
}

.secondary:hover { border-color: var(--gold); color: var(--gold); }

.danger { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.3); color: #fca5a5; }

/* ─── VIEWS ─── */
.view { display: none; }
.view.active { display: grid; gap: 18px; }

/* ─── KPI ─── */
.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 14px; }
.kpi-grid.compact { grid-template-columns: repeat(3, minmax(150px, 1fr)); }

.kpi {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  min-height: 105px;
  display: grid;
  align-content: space-between;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
}

.kpi::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,175,118,0.5), transparent);
}

.kpi:hover { border-color: rgba(212,175,118,0.35); }

.kpi span { color: #a09a92; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; }
.kpi strong { font-size: 26px; font-weight: 700; margin-top: 6px; color: #f0ece4; font-family: 'Playfair Display', serif; }
.kpi small { color: #7a7670; font-size: 11px; }

/* ─── SPLIT GRID ─── */
.split-grid, .rule-grid, .clinic-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.6fr);
  gap: 18px;
}

/* ─── PANEL ─── */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  min-width: 0;
}

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

/* ─── TABLE ─── */
.table-wrap { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 820px; }

th {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--gold);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  background: rgba(212,175,118,0.04);
}

td {
  text-align: left;
  padding: 12px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 13px;
  vertical-align: middle;
  color: #ddd8d0;
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(212,175,118,0.03); }

/* ─── INPUT / SELECT ─── */
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }

input, select, textarea {
  width: 100%;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 9px;
  padding: 9px 12px;
  background: rgba(255,255,255,0.06);
  color: #e8e4de;
  min-height: 38px;
  transition: border-color 0.18s;
  font-size: 13px;
}

input::placeholder { color: #6a6560; }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212,175,118,0.12);
  background: rgba(255,255,255,0.08);
}

select option { background: #1c2333; color: #e8e4de; }

.filters input { max-width: 300px; }
.filters select { max-width: 170px; }

/* 操作列下拉菜单特殊处理 */
.status-select {
  background: rgba(255,255,255,0.08) !important;
  color: #e8e4de !important;
  border: 1px solid rgba(255,255,255,0.15) !important;
  font-weight: 600;
}

/* ─── STATUS ─── */
.status {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.03em;
}

.status.pending { background: rgba(251,191,36,0.15); color: #fcd34d; border: 1px solid rgba(251,191,36,0.3); }
.status.active { background: rgba(74,222,128,0.12); color: #6ee7a0; border: 1px solid rgba(74,222,128,0.25); }
.status.overdue { background: rgba(248,113,113,0.12); color: #fca5a5; border: 1px solid rgba(248,113,113,0.3); }
.status.closed { background: rgba(96,165,250,0.12); color: #93c5fd; border: 1px solid rgba(96,165,250,0.25); }
.status.rejected { background: rgba(255,255,255,0.06); color: #9ca3af; border: 1px solid rgba(255,255,255,0.1); }

/* ─── BAR ─── */
.bar-list, .compact-list, .clinic-cards { display: grid; gap: 12px; }
.bar-row { display: grid; gap: 8px; }
.bar-top, .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.bar-track { height: 7px; background: rgba(255,255,255,0.07); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 999px; }

.list-row { border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; transition: border-color 0.18s; }
.list-row:hover { border-color: rgba(212,175,118,0.35); }
.list-row strong { display: block; font-size: 13px; color: #e8e4de; }
.list-row span, .meta { color: #908a82; font-size: 12px; margin-top: 3px; }

.risk-score { min-width: 42px; height: 32px; border-radius: 7px; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: rgba(77,217,192,0.1); color: var(--teal); border: 1px solid rgba(77,217,192,0.2); }
.risk-score.high { background: rgba(248,113,113,0.12); color: #fca5a5; border-color: rgba(248,113,113,0.3); }
.risk-score.medium { background: rgba(251,191,36,0.12); color: #fcd34d; border-color: rgba(251,191,36,0.25); }

/* ─── CLINIC ─── */
.clinic-card { border: 1px solid var(--border); border-radius: 11px; padding: 15px; display: grid; gap: 11px; background: var(--panel); transition: border-color 0.2s; }
.clinic-card:hover { border-color: rgba(212,175,118,0.35); }
.clinic-card header { display: flex; justify-content: space-between; gap: 10px; }
.clinic-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.clinic-stats div { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 9px; border: 1px solid var(--border); }
.clinic-stats span { color: #7a7670; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.clinic-stats strong { display: block; margin-top: 3px; font-size: 14px; color: #e8e4de; }

/* ─── FORM ─── */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(200px, 1fr)); gap: 15px; }
.form-grid.single { grid-template-columns: 1fr; }

label { display: grid; gap: 7px; color: #a09a92; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }

.notes { margin-top: 14px; }
.full { width: 100%; }

.rule-list { margin: 0; padding-left: 18px; display: grid; gap: 12px; color: #c8c2b8; font-size: 13px; line-height: 1.6; }

/* ─── DIALOG ─── */
dialog {
  width: min(880px, calc(100vw - 28px));
  border: 1px solid rgba(212,175,118,0.2);
  border-radius: 16px;
  padding: 0;
  background: #1a2235;
  box-shadow: 0 20px 70px rgba(0,0,0,0.7);
  color: var(--ink);
}

dialog::backdrop { background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); }

#orderForm { padding: 24px; }

.dialog-head, .dialog-actions { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.dialog-head { margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
.dialog-actions { align-items: center; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }

.icon-btn { width: 36px; padding: 0; background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: #a09a92; font-size: 19px; border-radius: 7px; transition: all 0.18s; }
.icon-btn:hover { border-color: var(--red); color: var(--red); }

.action-cell { display: flex; gap: 8px; flex-wrap: wrap; }
.tiny { min-height: 28px; padding: 0 9px; font-size: 12px; border-radius: 6px; }

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(212,175,118,0.25); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(212,175,118,0.45); }

/* ─── RESPONSIVE ─── */
@media (max-width: 980px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .nav { grid-template-columns: repeat(3, 1fr); }
  .split-grid, .rule-grid, .clinic-layout, .kpi-grid, .kpi-grid.compact { grid-template-columns: 1fr; }
  .main { padding: 18px; }
}

@media (max-width: 640px) {
  .main { padding: 14px; }
  .topbar, .dialog-head, .dialog-actions { display: grid; }
  .top-actions { justify-content: stretch; }
  .top-actions button, .dialog-actions button { width: 100%; }
  .nav { grid-template-columns: repeat(2, 1fr); }
  .form-grid { grid-template-columns: 1fr; }
  .filters input, .filters select { max-width: none; }
  h1 { font-size: 22px; }
}
</style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div>
            <strong>MORODOK</strong>
            <span>医美贷管理平台</span>
          </div>
        </div>
        <nav class="nav" aria-label="主导航">
          <button class="nav-item active" data-view="dashboard">◈ 总览</button>
          <button class="nav-item" data-view="orders">◎ 订单管理</button>
          <button class="nav-item" data-view="repayments">◷ 还款计划</button>
          <button class="nav-item" data-view="clinics">✦ 合作机构</button>
          <button class="nav-item" data-view="reports">◈ 财务报表</button>
          <button class="nav-item" data-view="risk">◉ 风险控制</button>
        </nav>
        <div class="sidebar-foot">
          <span>MORODOK · 医美贷</span>
          <strong id="todayLabel"></strong>
          <div id="syncStatus">
            <span id="syncDot"></span>
            <span id="syncTxt">连接中...</span>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="pageTitle">总览</h1>
            <p id="pageSubtitle">医美分期业务的订单、还款、机构和风险数据。</p>
          </div>
          <div class="top-actions">
            <button class="secondary" id="exportBtn" type="button">导出 CSV</button>
            <button class="primary" id="newOrderBtn" type="button">新建订单</button>
          </div>
        </header>

        <section class="view active" id="dashboardView">
          <div class="kpi-grid" id="kpiGrid"></div>
          <div class="split-grid">
            <section class="panel">
              <div class="panel-head"><h2>机构表现</h2><span>按放款与逾期</span></div>
              <div id="clinicPerformance" class="bar-list"></div>
            </section>
            <section class="panel">
              <div class="panel-head"><h2>风险队列</h2><span>优先处理</span></div>
              <div id="riskQueue" class="compact-list"></div>
            </section>
          </div>
          <section class="panel">
            <div class="panel-head"><h2>最近订单</h2><span>最新进件与状态</span></div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>订单</th><th>客户</th><th>机构</th><th>项目</th><th>金额</th><th>状态</th></tr></thead>
                <tbody id="recentOrders"></tbody>
              </table>
            </div>
          </section>
        </section>

        <section class="view" id="ordersView">
          <div class="filters">
            <input id="orderSearch" type="search" placeholder="搜索客户、机构、订单号" />
            <select id="statusFilter">
              <option value="all">全部状态</option>
              <option value="pending">待审核</option>
              <option value="active">还款中</option>
              <option value="overdue">逾期</option>
              <option value="closed">已结清</option>
              <option value="rejected">已拒绝</option>
            </select>
            <select id="clinicFilter"><option value="all">全部机构</option></select>
          </div>
          <section class="panel">
            <div class="table-wrap">
              <table>
                <thead><tr><th>订单号</th><th>客户</th><th>机构</th><th>项目</th><th>本金</th><th>首付</th><th>期数</th><th>状态</th><th>操作</th></tr></thead>
                <tbody id="ordersTable"></tbody>
              </table>
            </div>
          </section>
        </section>

        <section class="view" id="repaymentsView">
          <div id="repaymentContent"></div>
        </section>

        <section class="view" id="clinicsView">
          <div class="clinic-layout">
            <section class="panel">
              <div class="panel-head"><h2>合作机构</h2><span>机构限额与坏账表现</span></div>
              <div id="clinicCards" class="clinic-cards"></div>
            </section>
            <section class="panel">
              <div class="panel-head"><h2>新增机构</h2><span>试点时控制总额度</span></div>
              <form id="clinicForm" class="form-grid single">
                <label>机构名称<input name="name" required /></label>
                <label>联系人<input name="manager" required /></label>
                <label>城市<input name="city" value="Phnom Penh" required /></label>
                <label>试点限额 USD<input name="limit" type="number" min="1000" step="100" required /></label>
                <button class="primary full" type="submit">保存机构</button>
              </form>
            </section>
          </div>
        </section>

        <section class="view" id="reportsView">
          <div class="kpi-grid" id="financeKpis"></div>
          <div id="financeReport" style="display:grid;gap:18px;margin-top:18px"></div>
        </section>

        <section class="view" id="riskView">
          <div class="risk-content" style="display:grid;gap:18px"></div>
        </section>
      </main>
    </div>

    <dialog id="orderDialog">
      <form id="orderForm" method="dialog">
        <div class="dialog-head">
          <div>
            <h2>新建医美分期订单</h2>
            <p>款项默认直接结算给医美机构，客户按期还款。</p>
          </div>
          <button class="icon-btn" id="closeDialog" type="button" aria-label="关闭">×</button>
        </div>
        <div class="form-grid">
          <label>客户姓名<input name="customer" required /></label>
          <label>电话<input name="phone" required /></label>
          <label>月收入 USD<input name="income" type="number" min="0" step="10" required /></label>
          <label>机构<select name="clinic" id="orderClinicSelect" required></select></label>
          <label>医美项目<input name="treatment" required placeholder="例如 激光脱毛疗程" /></label>
          <label>项目总价 USD<input name="totalPrice" type="number" min="100" step="10" required /></label>
          <label>客户首付 USD<input name="downPayment" type="number" min="0" step="10" required /></label>
          <label>期数<select name="term">
            <option value="3">3 期</option>
            <option value="6">6 期</option>
            <option value="9">9 期</option>
            <option value="12">12 期</option>
          </select></label>
          <label>月利率 %<input name="monthlyRate" type="number" min="0" step="0.1" value="1.5" required /></label>
          <label>机构服务费 %<input name="merchantFee" type="number" min="0" step="0.1" value="3" required /></label>
          <label>视频确认<select name="videoConfirmed">
            <option value="yes">已确认</option>
            <option value="no">未确认</option>
          </select></label>
          <label>状态<select name="status">
            <option value="pending">待审核</option>
            <option value="active">还款中</option>

let state = structuredClone(sampleData);

function setSyncStatus(s) {
  _syncStatus = s;

  if (!dot || !txt) return;
  if (s === "syncing") { dot.style.background = "#ff9800"; txt.textContent = "同步中..."; }
  else if (s === "ok") { dot.style.background = "#4caf50"; txt.textContent = "已同步"; }
  else if (s === "error") { dot.style.background = "#f44336"; txt.textContent = "同步失败"; }
}

async function loadState() {
  try {
    setSyncStatus("syncing");
    const res = await fetch("/api/data");
    const data = await res.json();
    if (data.orders) state.orders = data.orders;
    if (data.clinics) state.clinics = data.clinics;
    setSyncStatus("ok");
  } catch (e) {
    setSyncStatus("error");

}

async function saveState() {
  try {

    const res = await fetch("/api/data", {
      method: "POST",
      headers: { "Content-Type": "application/json" },

    });
    if (res.ok) setSyncStatus("ok"); else setSyncStatus("error");
  } catch (e) {
    setSyncStatus("error");
  }
}

function money(value) {
  return `$${Number(value || 0).toLocaleString("en-US", { maximumFractionDigits: 0 })}`;
}

function pct(value) {
  return `${Number(value || 0).toFixed(1)}%`;
}

function addDays(date, days) {
  const next = new Date(date);
  next.setDate(next.getDate() + days);
  return next;
}

function formatDate(date) {
  return new Date(date).toISOString().slice(0, 10);
}

function getClinic(id) {
  return state.clinics.find((clinic) => clinic.id === id) || { name: "未知机构", limit: 0 };
}

function installmentAmount(order) {
  const totalInterest = order.principal * (order.monthlyRate / 100) * order.term;
  return (order.principal + totalInterest) / order.term;
}

function merchantFee(order) {
  return order.principal * (order.merchantFee / 100);
}

function interestIncome(order) {
  return order.principal * (order.monthlyRate / 100) * order.term;
}

function paymentSchedule(order) {
  return Array.from({ length: order.term }, (_, index) => {
    const dueDate = addDays(order.createdAt, 30 * (index + 1));
    let status = "unpaid";
    if (index < order.paidInstallments) status = "paid";
    if (order.status === "overdue" && index === order.paidInstallments) status = "overdue";
    if (order.status === "closed") status = "paid";
    return {
      orderId: order.id,
      customer: order.customer,
      index: index + 1,
      dueDate: formatDate(dueDate),
      amount: installmentAmount(order),
      status,
    };
  });
}

function allRepayments() {
  return state.orders
    .filter((order) => ["active", "overdue", "closed"].includes(order.status))
    .flatMap(paymentSchedule)
    .sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
}

function riskScore(order) {
  const downPaymentRatio = order.downPayment / Math.max(order.totalPrice, 1);
  const monthlyBurden = installmentAmount(order) / Math.max(order.income, 1);
  const clinic = clinicStats(order.clinicId);
  let score = 0;
  let factors = [];

  // ── 首付比例（权重30）──
  if (downPaymentRatio < 0.1) { score += 30; factors.push({label:"首付极低(<10%)",weight:30,level:"high"}); }
  else if (downPaymentRatio < 0.2) { score += 20; factors.push({label:"首付偏低(<20%)",weight:20,level:"medium"}); }
  else if (downPaymentRatio < 0.3) { score += 8; factors.push({label:"首付一般(<30%)",weight:8,level:"low"}); }

  // ── 收入负担率（权重25）──
  if (monthlyBurden > 0.5) { score += 25; factors.push({label:"月供超收入50%",weight:25,level:"high"}); }
  else if (monthlyBurden > 0.35) { score += 18; factors.push({label:"月供超收入35%",weight:18,level:"medium"}); }
  else if (monthlyBurden > 0.25) { score += 10; factors.push({label:"月供超收入25%",weight:10,level:"low"}); }

  // ── 视频确认（权重20）──
  if (!order.videoConfirmed || order.videoConfirmed === "no") { score += 20; factors.push({label:"未完成视频确认",weight:20,level:"high"}); }

  // ── 贷款金额（权重10）──
  if (order.principal > 2000) { score += 10; factors.push({label:"大额贷款(>$2000)",weight:10,level:"medium"}); }
  else if (order.principal > 1000) { score += 5; factors.push({label:"中额贷款(>$1000)",weight:5,level:"low"}); }

  // ── 期数风险（权重8）──
  if (order.term >= 12) { score += 8; factors.push({label:"长期贷款(≥12期)",weight:8,level:"medium"}); }
  else if (order.term >= 9) { score += 4; factors.push({label:"中长期(≥9期)",weight:4,level:"low"}); }

  // ── 机构风险（权重15）──
  if (clinic.firstOverdueRate > 15) { score += 15; factors.push({label:"机构首逾率>15%",weight:15,level:"high"}); }
  else if (clinic.firstOverdueRate > 8) { score += 10; factors.push({label:"机构首逾率>8%",weight:10,level:"medium"}); }

  // ── 当前逾期（权重20）──
  if (order.status === "overdue") { score += 20; factors.push({label:"当前已逾期",weight:20,level:"high"}); }

  // ── 收入过低（权重8）──
  if (order.income < 300) { score += 8; factors.push({label:"月收入<$300",weight:8,level:"high"}); }
  else if (order.income < 500) { score += 4; factors.push({label:"月收入<$500",weight:4,level:"medium"}); }

  order._riskFactors = factors;
  return Math.min(score, 100);
}

function riskClass(score) {
  if (score >= 70) return "high";
  if (score >= 45) return "medium";
  return "low";
}

function clinicStats(clinicId) {
  const orders = state.orders.filter((order) => order.clinicId === clinicId);
  const activeOrders = orders.filter((order) => order.status !== "rejected");
  const principal = activeOrders.reduce((sum, order) => sum + order.principal, 0);
  const overdue = activeOrders.filter((order) => order.status === "overdue").length;
  const firstOverdue = activeOrders.filter((order) => order.status === "overdue" && order.paidInstallments === 0).length;
  return {
    orders: activeOrders.length,
    principal,
    overdueRate: activeOrders.length ? (overdue / activeOrders.length) * 100 : 0,
    firstOverdueRate: activeOrders.length ? (firstOverdue / activeOrders.length) * 100 : 0,
  };
}

function portfolioMetrics() {
  const funded = state.orders.filter((order) => ["active", "overdue", "closed"].includes(order.status));
  const principal = funded.reduce((sum, order) => sum + order.principal, 0);
  const outstanding = funded.reduce((sum, order) => {
    const remaining = Math.max(order.term - order.paidInstallments, 0);
    return sum + installmentAmount(order) * remaining;
  }, 0);
  const interest = funded.reduce((sum, order) => sum + interestIncome(order), 0);
  const fees = funded.reduce((sum, order) => sum + merchantFee(order), 0);
  const overdue = funded.filter((order) => order.status === "overdue");
  const firstOverdue = overdue.filter((order) => order.paidInstallments === 0);
  return {
    funded,
    principal,
    outstanding,
    interest,
    fees,
    overdueRate: funded.length ? (overdue.length / funded.length) * 100 : 0,
    firstOverdueRate: funded.length ? (firstOverdue.length / funded.length) * 100 : 0,
  };
}

let _repayTab = "pending";

function renderRepayments() {
  const all = allRepayments();
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);
  const thisMonth = today.toISOString().slice(0,7);

  const pending = all.filter(i => i.status === "unpaid");
  const overdue = all.filter(i => i.status === "overdue" || (i.status === "unpaid" && i.dueDate < todayStr));
  const thisMonthItems = all.filter(i => i.dueDate.startsWith(thisMonth));
  const paidItems = all.filter(i => i.status === "paid");

  const pendingAmt = pending.reduce((s,i) => s+i.amount, 0);
  const overdueAmt = overdue.reduce((s,i) => s+i.amount, 0);
  const thisMonthDue = thisMonthItems.filter(i=>i.status!=="paid").reduce((s,i)=>s+i.amount,0);
  const paidAmt = paidItems.reduce((s,i) => s+i.amount, 0);

  // 按tab筛选
  let tabItems = _repayTab==="overdue" ? overdue
    : _repayTab==="thisMonth" ? thisMonthItems
    : _repayTab==="all" ? all
    : pending;

  // 搜索过滤
  if (_repaySearch) {
    const kw = _repaySearch.toLowerCase();
    tabItems = tabItems.filter(i =>
      i.customer.toLowerCase().includes(kw) ||
      i.orderId.toLowerCase().includes(kw) ||
      (i.treatment||"").toLowerCase().includes(kw)

  // 按客户+订单分组

      const order = state.orders.find(o => o.id === item.orderId);

        treatment: order ? order.treatment : "", term: order ? order.term : 0,
        principal: order ? order.principal : 0, status: order ? order.status : "",
        items: [] };
    }
    groups[key].items.push(item);
  });
  const groupList = Object.values(groups).sort((a,b) => {
    // 逾期的排前面
    const aHasOverdue = a.items.some(i => i.status==="overdue"||(i.status==="unpaid"&&i.dueDate<todayStr));
    const bHasOverdue = b.items.some(i => i.status==="overdue"||(i.status==="unpaid"&&i.dueDate<todayStr));

    if (!aHasOverdue && bHasOverdue) return 1;
    return a.customer.localeCompare(b.customer);

      ${[
        ["⏳ 待收期数", pending.length, money(pendingAmt), "#d97706", "#fef3c7", "pending"],
        ["🚨 逾期期数", overdue.length, money(overdueAmt), "#dc2626", "#fee2e2", "overdue"],
        ["📅 本月应收", thisMonthItems.length, money(thisMonthDue), "#0284c7", "#e0f2fe", "thisMonth"],
        ["✅ 已收期数", paidItems.length, money(paidAmt), "#0f766e", "#f0fdf4", "all"],
      ].map(([label, val, amt, color, bg, tab]) => `
        <div onclick="switchRepayTab('${tab}')" style="background:rgba(255,255,255,0.02);border-radius:10px;padding:16px;border:1px solid #e5e7eb;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid ${color};cursor:pointer;transition:.15s" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">
          <div style="font-size:12px;color:${color};font-weight:700">${label}</div>
          <div style="font-size:28px;font-weight:800;color:${color};margin:6px 0">${val}</div>
          <div style="font-size:12px;color:#908a82">${amt}</div>
        </div>
      `).join("")}
    </div>

    <!-- 标签页 + 搜索 -->
    <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap">
      <div style="display:flex;gap:6px">
        ${[
          ["pending","⏳ 待收", pending.length],
          ["overdue","🚨 逾期", overdue.length],
          ["thisMonth","📅 本月", thisMonthItems.length],
          ["all","📋 全部", all.length],
        ].map(([tab, label, count]) => `
          <button onclick="switchRepayTab('${tab}')" style="padding:7px 14px;border-radius:20px;border:2px solid ${_repayTab===tab?'currentColor':'transparent'};cursor:pointer;font-size:13px;font-weight:700;background:${_repayTab===tab?'#1f2937':'#f3f4f6'};color:${_repayTab===tab?'#fff':'#6b7280'};transition:.2s">
            ${label} ${count}

        `).join("")}
      </div>
      <input type="search" placeholder="🔍 搜索客户/订单/项目..." value="${_repaySearch}"
        oninput="_repaySearch=this.value;renderRepayments()"
        style="border:1.5px solid #e5e7eb;border-radius:8px;padding:8px 14px;font-size:13px;min-width:240px;outline:none">
    </div>

    <!-- 客户分组卡片 -->
    ${groupList.length === 0 ? `
      <div style="text-align:center;padding:50px;color:#908a82;background:#fff;border-radius:10px;border:1px solid #e5e7eb">

    ` : groupList.map(group => {

      const allPaid = group.items.every(i => i.status==="paid");
      const totalAmt = group.items.reduce((s,i)=>s+i.amount,0);
      const paidAmt2 = group.items.filter(i=>i.status==="paid").reduce((s,i)=>s+i.amount,0);
      const unpaidAmt = totalAmt - paidAmt2;
      const progress = totalAmt > 0 ? (paidAmt2/totalAmt)*100 : 0;
      const borderColor = hasOverdue ? "#dc2626" : allPaid ? "#0f766e" : "#d97706";
      const expanded = _repayExpanded[group.orderId] === true; // 默认折叠
      const paidCount = group.items.filter(i=>i.status==="paid").length;

      return `

              <div style="width:60px">

              </div>
              <div style="font-size:18px;color:#b0aaa0;transition:.2s;transform:${expanded?'rotate(180deg)':'rotate(0deg)'}">▼</div>
            </div>
          </div>

          <!-- 展开的还款期数列表 -->
          ${expanded ? `
          <div style="border-top:1px solid #f3f4f6">
            <table style="width:100%;border-collapse:collapse">
              <thead>
                <tr style="background:rgba(255,255,255,0.03)">
                  <th style="padding:8px 18px;font-size:11px;color:#908a82;font-weight:700;text-align:left">期数</th>
                  <th style="padding:8px 12px;font-size:11px;color:#908a82;font-weight:700;text-align:left">到期日</th>
                  <th style="padding:8px 12px;font-size:11px;color:#908a82;font-weight:700;text-align:left">应收</th>
                  <th style="padding:8px 12px;font-size:11px;color:#908a82;font-weight:700;text-align:left">逾期天数</th>

              </thead>
              <tbody>
                ${group.items.map(item => {
                  const isOv = item.status==="overdue"||(item.status==="unpaid"&&item.dueDate<todayStr);
                  const days = isOv&&item.status!=="paid" ? Math.floor((today-new Date(item.dueDate))/86400000) : 0;
                  const rowBg = item.status==="paid"?"#f0fdf4":isOv?"#fff5f5":"#fff";
                  return `
                    <tr style="background:${rowBg};border-bottom:1px solid #f9fafb">
                      <td style="padding:10px 18px;font-weight:700;color:#e0dbd4">第 ${item.index} 期</td>

                      <td style="padding:10px 12px;font-weight:700;color:${isOv?'#dc2626':item.status==='paid'?'#0f766e':'#d97706'}">${money(item.amount)}</td>
                      <td style="padding:10px 12px">
                        ${days>0?`<span style="background:rgba(248,113,113,0.1);color:#fca5a5;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700">逾期 ${days} 天</span>`:'<span style="color:#b0aaa0;font-size:12px">—</span>'}

                      <td style="padding:10px 12px">
                        <select onchange="changeRepayStatus(this,'${item.orderId}',${item.index-1})"

                          <option value="paid" ${item.status==="paid"?"selected":""}>已还</option>
                          <option value="overdue" ${item.status==="overdue"?"selected":""}>逾期</option>
                        </select>
                      </td>
                    </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>` : ""}
        </div>

  `;
}

function renderReports() {
  const metrics = portfolioMetrics();
  const funded = metrics.funded;
  const closed = funded.filter(o => o.status === "closed");
  const active = funded.filter(o => o.status === "active");
  const overdue = funded.filter(o => o.status === "overdue");
  const totalCollected = funded.reduce((s, o) => s + installmentAmount(o) * o.paidInstallments, 0);
  const totalPrincipal = funded.reduce((s, o) => s + o.principal, 0);
  const totalInterest = metrics.interest;
  const totalFees = metrics.fees;
  const totalRevenue = totalInterest + totalFees;
  const avgLoan = funded.length ? totalPrincipal / funded.length : 0;
  const avgTerm = funded.length ? funded.reduce((s, o) => s + o.term, 0) / funded.length : 0;
  const collectionRate = (totalPrincipal + totalInterest) > 0 ? (totalCollected / (totalPrincipal + totalInterest)) * 100 : 0;
  const pendingOrders = state.orders.filter(o => o.status === "pending").length;

  // ── KPI 卡片 ──
  const kpiEl = document.getElementById("financeKpis");
  if (kpiEl) kpiEl.innerHTML = `
    <div class="kpi" style="border-left:4px solid #0f766e">
      <span>💰 放款总额</span>
      <strong style="color:#0f766e">${money(totalPrincipal)}</strong>
      <small>${funded.length} 笔有效订单</small>
    </div>
    <div class="kpi" style="border-left:4px solid #7c3aed">
      <span>📈 预计总收益</span>
      <strong style="color:#7c3aed">${money(totalRevenue)}</strong>
      <small>利息 ${money(totalInterest)} + 服务费 ${money(totalFees)}</small>
    </div>
    <div class="kpi" style="border-left:4px solid #0284c7">
      <span>✅ 已回收金额</span>
      <strong style="color:#60a5fa">${money(totalCollected)}</strong>
      <small>回收率 ${pct(collectionRate)}</small>
    </div>
    <div class="kpi" style="border-left:4px solid #dc2626">
      <span>⏳ 待回收余额</span>
      <strong style="color:#f87171">${money(metrics.outstanding)}</strong>
      <small>${overdue.length} 笔逾期 · ${active.length} 笔还款中</small>
    </div>
  `;

  // ── 机构收益排行 ──
  const clinicRevenue = state.clinics.map(clinic => {
    const orders = funded.filter(o => o.clinicId === clinic.id);
    const p = orders.reduce((s, o) => s + o.principal, 0);
    const i = orders.reduce((s, o) => s + interestIncome(o), 0);
    const f = orders.reduce((s, o) => s + merchantFee(o), 0);
    const collected = orders.reduce((s, o) => s + installmentAmount(o) * o.paidInstallments, 0);
    const overdueCount = orders.filter(o => o.status === "overdue").length;
    return { name: clinic.name, orders: orders.length, principal: p, interest: i, fees: f, revenue: i + f, collected, overdueCount };
  }).filter(c => c.orders > 0).sort((a, b) => b.revenue - a.revenue);

  const maxRev = Math.max(...clinicRevenue.map(c => c.revenue), 1);

  // ── 月度趋势（按订单创建月份）──
  const monthMap = {};
  funded.forEach(o => {
    const m = new Date(o.createdAt).toISOString().slice(0, 7);
    if (!monthMap[m]) monthMap[m] = { month: m, count: 0, principal: 0, interest: 0 };
    monthMap[m].count++;
    monthMap[m].principal += o.principal;
    monthMap[m].interest += interestIncome(o);
  });
  const months = Object.values(monthMap).sort((a, b) => a.month.localeCompare(b.month));
  const maxMonth = Math.max(...months.map(m => m.principal), 1);

  // ── 项目分布 ──
  const treatMap = {};
  funded.forEach(o => {
    const key = o.treatment || "其他";
    if (!treatMap[key]) treatMap[key] = { count: 0, principal: 0 };
    treatMap[key].count++;
    treatMap[key].principal += o.principal;
  });
  const treats = Object.entries(treatMap).sort((a, b) => b[1].principal - a[1].principal).slice(0, 5);
  const maxTreat = Math.max(...treats.map(t => t[1].principal), 1);

  const reportsEl = document.getElementById("financeReport");

              <td>—</td><td style="color:#908a82;font-size:12px">${funded.length} 笔有效订单</td>
            </tr>
            <tr>
              <td>📈 利息收入（预计）</td>
              <td>${money(totalInterest)}</td>
              <td>${pct(totalPrincipal ? (totalInterest/totalPrincipal)*100 : 0)}</td>
              <td style="color:#908a82;font-size:12px">按完整期限计算</td>

              <td style="color:#908a82;font-size:12px">按本金比例收取</td>

            <tr style="background:rgba(96,165,250,0.06)">
              <td><b style="color:#60a5fa">💵 总收益（预计）</b></td>
              <td><b style="color:#60a5fa">${money(totalRevenue)}</b></td>
              <td><b>${pct(totalPrincipal ? (totalRevenue/totalPrincipal)*100 : 0)}</b></td>
              <td style="color:#908a82;font-size:12px">利息 + 服务费</td>
            </tr>
            <tr style="background:rgba(251,191,36,0.08)">
              <td>✅ 已回收（含本金+利息）</td>
              <td>${money(totalCollected)}</td>
              <td>${pct(collectionRate)}</td>
              <td style="color:#908a82;font-size:12px">实际到账金额</td>

            <tr style="background:rgba(248,113,113,0.08)">

    </section>

    <!-- 订单状态分布 + 关键指标 -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
      <section class="panel">
        <div class="panel-head"><h2>📋 订单状态分布</h2></div>
        <div style="display:grid;gap:10px;margin-top:4px">
          ${[
            ["还款中", active.length, state.orders.filter(o=>o.status==="active").length, "#0f766e", "active"],
            ["已结清", closed.length, state.orders.filter(o=>o.status==="closed").length, "#0284c7", "closed"],

          ].map(([label, _, count, color, cls]) => `

              <div style="display:flex;align-items:center;gap:10px">
                <span class="status ${cls}">${label}</span>
              </div>

function renderRisk() {
  const orders = state.orders.filter(o => o.status !== "rejected");
  const scoredOrders = orders.map(o => { const s = riskScore(o); return {...o, _score: s}; })
    .sort((a, b) => b._score - a._score);

  const highRisk = scoredOrders.filter(o => o._score >= 70);
  const midRisk = scoredOrders.filter(o => o._score >= 45 && o._score < 70);
  const lowRisk = scoredOrders.filter(o => o._score < 45);
  const overdue = orders.filter(o => o.status === "overdue");
  const noVideo = orders.filter(o => !o.videoConfirmed || o.videoConfirmed === "no");
  const highBurden = orders.filter(o => installmentAmount(o) / Math.max(o.income, 1) > 0.35);
  const lowDown = orders.filter(o => o.downPayment / Math.max(o.totalPrice, 1) < 0.2);

  // 机构风险分析
  const clinicRisk = state.clinics.map(clinic => {
    const cs = clinicStats(clinic.id);
    const clinicOrders = orders.filter(o => o.clinicId === clinic.id);
    const overdueCount = clinicOrders.filter(o => o.status === "overdue").length;
    const totalActive = clinicOrders.filter(o => ["active","overdue"].includes(o.status)).length;
    const overdueRate = totalActive > 0 ? (overdueCount / totalActive) * 100 : 0;
    return { name: clinic.name, orders: clinicOrders.length, principal: cs.principal,
      limit: clinic.limit, used: cs.principal / Math.max(clinic.limit, 1) * 100,
      overdueRate, overdueCount, firstOverdueRate: cs.firstOverdueRate };
  }).filter(c => c.orders > 0);

  const riskEl = document.getElementById("riskView");
  if (!riskEl) return;
  const contentEl = riskEl.querySelector(".risk-content");
  if (!contentEl) return;

  contentEl.innerHTML = `
    <!-- ① 风险仪表盘 -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px">
      ${[
        ["🔴 高风险订单", highRisk.length, "#fee2e2", "#991b1b", "风险分≥70"],
        ["🟡 中风险订单", midRisk.length, "#fef3c7", "#92400e", "风险分45-69"],
        ["🟢 低风险订单", lowRisk.length, "#dcfce7", "#166534", "风险分<45"],
        ["⚠️ 当前逾期", overdue.length, "#fce7f3", "#9d174d", `占比${pct(orders.length?(overdue.length/orders.length)*100:0)}`],
      ].map(([label, val, bg, color, note]) => `
        <div style="background:${bg};border-radius:10px;padding:16px;text-align:center">
          <div style="font-size:13px;color:${color};font-weight:700;margin-bottom:8px">${label}</div>
          <div style="font-size:32px;font-weight:800;color:${color}">${val}</div>
          <div style="font-size:11px;color:${color};opacity:.7;margin-top:4px">${note}</div>
        </div>

function riskRows(orders, limit) {
  return orders
    .slice()
    .sort((a, b) => riskScore(b) - riskScore(a))
    .slice(0, limit)
    .map((order) => {
      const score = riskScore(order);
      return `
        <div class="list-row">
          <div>
            <strong>${order.customer} · ${order.treatment}</strong>
            <span>${getClinic(order.clinicId).name} · 首付 ${pct((order.downPayment / order.totalPrice) * 100)} · 月供 ${money(installmentAmount(order))}</span>
          </div>
          <div class="risk-score ${riskClass(score)}">${score}</div>
        </div>
      `;
    })
    .join("");
}

function kpiCard([label, value, note]) {
  return `<article class="kpi"><span>${label}</span><strong>${value}</strong><small>${note}</small></article>`;
}

function statusBadge(status) {
  const text = statusText[status] || status || "未知";
  return `<span class="status ${status || "pending"}">${text}</span>`;
}

function repaymentBadge(status) {
  const map = { paid: ["closed", "已还"], unpaid: ["pending", "未收"], overdue: ["overdue", "逾期"] };
  const [className, text] = map[status];
  return `<span class="status ${className}">${text}</span>`;
}

function renderClinicOptions() {
  const options = state.clinics.map((clinic) => `<option value="${clinic.id}">${clinic.name}</option>`).join("");
  document.getElementById("orderClinicSelect").innerHTML = options;
  document.getElementById("clinicFilter").innerHTML = `<option value="all">全部机构</option>${options}`;
}

async function addOrder(form) {
  const data = Object.fromEntries(new FormData(form).entries());
  const totalPrice = Number(data.totalPrice);
  const downPayment = Number(data.downPayment);
  const principal = Math.max(totalPrice - downPayment, 0);
  const order = {
    id: `MBL-${new Date().toISOString().slice(2, 10).replaceAll("-", "")}-${String(state.orders.length + 1).padStart(3, "0")}`,
    customer: data.customer,
    phone: data.phone,
    income: Number(data.income),
    clinicId: data.clinic,
    treatment: data.treatment,
    totalPrice,
    downPayment,
    principal,
    term: Number(data.term),
    monthlyRate: Number(data.monthlyRate),
    merchantFee: Number(data.merchantFee),
    status: data.status,
    videoConfirmed: data.videoConfirmed === "yes",
    notes: data.notes,
    createdAt: formatDate(new Date()),
    paidInstallments: 0,
  };
  state.orders.unshift(order);
  render();
  saveState();
}

async function addClinic(form) {
  const data = Object.fromEntries(new FormData(form).entries());
  state.clinics.push({
    id: `CL-${String(state.clinics.length + 1).padStart(3, "0")}`,
    name: data.name,
    manager: data.manager,
    city: data.city,
    limit: Number(data.limit),
  });
  render();
  form.reset();
  saveState();
}

function changeRepayStatus(select, orderId, periodIndex) {
  const order = state.orders.find((item) => item.id === orderId);
  if (!order) return;
  const newStatus = select.value;
  if (newStatus === "paid") {
    // 标记该期已还，更新paidInstallments
    order.paidInstallments = Math.max(order.paidInstallments, periodIndex + 1);
    if (order.paidInstallments >= order.term) order.status = "closed";
    else if (order.status === "overdue") order.status = "active";
  } else if (newStatus === "overdue") {
    order.status = "overdue";
  } else if (newStatus === "unpaid") {
    // 取消还款标记
    if (order.paidInstallments > periodIndex) order.paidInstallments = periodIndex;
    if (order.status === "closed") order.status = "active";
  }
  render();
  saveState();
}

function deleteOrder(id) {
  const order = state.orders.find(o => o.id === id);
  if (!order) return;
  // 确认弹窗
  const confirmed = window.confirm(
    `确认删除订单？\n\n客户：${order.customer}\n项目：${order.treatment}\n本金：$${order.principal}\n\n⚠️ 删除后该订单的所有还款记录也将消失，此操作不可撤销！`
  );
  if (!confirmed) return;
  // 删除订单
  state.orders = state.orders.filter(o => o.id !== id);
  // 全系统同步更新
  render();
  saveState();
}

function changeOrderStatus(select) {
  const id = select.dataset.id;
  const newStatus = select.value;
  const order = state.orders.find((item) => item.id === id);
  if (!order) return;
  order.status = newStatus;
  if (newStatus === "closed") order.paidInstallments = order.term;
  render();
  saveState();
}

async function updateOrder(id, action) {
  const order = state.orders.find((item) => item.id === id);
  if (!order) return;
  if (action === "approve") order.status = "active";
  if (action === "reject") order.status = "rejected";
  if (action === "overdue") order.status = "overdue";
  if (action === "close") {
    order.status = "closed";
    order.paidInstallments = order.term;
  }
  if (action === "pay") {
    order.paidInstallments = Math.min(order.paidInstallments + 1, order.term);
    if (order.paidInstallments >= order.term) order.status = "closed";
    else if (order.status === "overdue") order.status = "active";
  }
  render();  // 先更新界面
  saveState(); // 后台保存，不阻塞UI
}

function exportCsv() {
  const rows = [
    ["订单号", "客户", "电话", "机构", "项目", "总价", "首付", "本金", "期数", "月利率", "机构服务费", "状态", "风险分", "创建日期"],
    ...state.orders.map((order) => [
      order.id,
      order.customer,
      order.phone,
      getClinic(order.clinicId).name,
      order.treatment,
      order.totalPrice,
      order.downPayment,
      order.principal,
      order.term,
      order.monthlyRate,
      order.merchantFee,
      statusText[order.status],
      riskScore(order),
      order.createdAt,
    ]),
  ];
  const csv = rows.map((row) => row.map((cell) => `"${String(cell).replaceAll('"', '""')}"`).join(",")).join("\n");
  const blob = new Blob([`\ufeff${csv}`], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = `medical-beauty-loans-${formatDate(new Date())}.csv`;
  anchor.click();
  URL.revokeObjectURL(url);
}

    const view = button.dataset.view;
    document.querySelectorAll(".nav-item").forEach((item) => item.classList.toggle("active", item === button));

});

document.getElementById("newOrderBtn").addEventListener("click", () => document.getElementById("orderDialog").showModal());

document.body.addEventListener("click", (event) => {
  const button = event.target.closest("[data-action]");
  if (!button) return;
  updateOrder(button.dataset.id, button.dataset.action);
});

document.getElementById("todayLabel").textContent = formatDate(new Date());
loadState().then(() => render());

    </script>
